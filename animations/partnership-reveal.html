<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orbisk × Minor Hotels</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* ─── Config variables — swap partner by editing these ───────────────────── */
  :root {
    --color-night-forest: #1F4D4A;
    --color-cream: #FAF6EB;
    --color-warm-orange: #FFE4D6;

    --logo-orbisk: url('../assets/orbisk-logo.png');
    --logo-partner: url('../assets/minor-hotels-logo.png');

    --title-text: "Orbisk × Minor Hotels";
    --body-text: "AI-powered food waste intelligence, now live in Minor Hotels' kitchens.";

    --canvas-w: 1200px;
    --canvas-h: 960px;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: var(--canvas-w);
    height: var(--canvas-h);
    overflow: hidden;
    background: var(--color-cream);
    font-family: 'Poppins', 'Inter', system-ui, sans-serif;
  }

  /* Background: cream with a soft warm-orange gradient in bottom-right corner */
  .bg {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 70% 60% at 110% 110%,
        rgba(255, 228, 214, 0.55) 0%,
        rgba(255, 228, 214, 0.0) 70%),
      var(--color-cream);
  }

  /* ─── Stage ─────────────────────────────────────────────────────────────── */
  .stage {
    position: relative;
    width: var(--canvas-w);
    height: var(--canvas-h);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 52px;
  }

  /* ─── Lockup: two logos + divider ───────────────────────────────────────── */
  .lockup {
    display: flex;
    align-items: center;
    gap: 0;
    position: relative;
    height: 120px;
  }

  .logo-wrap {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 120px;
    overflow: visible;
  }

  .logo-wrap img,
  .logo-wrap canvas {
    max-height: 100px;
    max-width: 340px;
    width: auto;
    height: auto;
    object-fit: contain;
    display: block;
  }

  /* Divider */
  .divider {
    width: 1.5px;
    height: 0px;         /* animated to 100px */
    background: var(--color-night-forest);
    opacity: 0;
    margin: 0 64px;
    flex-shrink: 0;
    border-radius: 1px;
  }

  /* ─── Text block ─────────────────────────────────────────────────────────── */
  .text-block {
    text-align: center;
    opacity: 0;
    transform: translateY(10px);
  }

  .text-title {
    font-family: 'Poppins', sans-serif;
    font-weight: 700;
    font-size: 36px;
    line-height: 1.2;
    color: var(--color-night-forest);
    letter-spacing: -0.5px;
  }

  .text-body {
    font-family: 'Inter', 'Poppins', sans-serif;
    font-weight: 400;
    font-size: 20px;
    line-height: 1.55;
    color: var(--color-night-forest);
    opacity: 0.75;
    margin-top: 10px;
    max-width: 680px;
  }

  /* ─── Initial animation states ──────────────────────────────────────────── */
  #logo-orbisk {
    opacity: 0;
    transform: scale(0.85);
    /* will be translated to centre, then to left */
    transform-origin: center center;
  }

  #logo-partner {
    opacity: 0;
    transform: scale(0.88) translateX(30px);
    transform-origin: center center;
  }
</style>
</head>
<body>

<div class="bg"></div>

<div class="stage">
  <div class="lockup" id="lockup">
    <!-- Orbisk logo: starts centered, slides left -->
    <div class="logo-wrap" id="logo-orbisk">
      <canvas id="canvas-orbisk"></canvas>
    </div>

    <!-- Divider -->
    <div class="divider" id="divider"></div>

    <!-- Partner logo: fades in from right -->
    <div class="logo-wrap" id="logo-partner">
      <canvas id="canvas-partner"></canvas>
    </div>
  </div>

  <div class="text-block" id="text-block">
    <div class="text-title" id="text-title"></div>
    <div class="text-body" id="text-body"></div>
  </div>
</div>

<script>
/* ═══════════════════════════════════════════════════════════════════════════
   CONFIG — edit these to swap partner
   ═══════════════════════════════════════════════════════════════════════════ */
const CONFIG = {
  orbiskLogo:  '../assets/orbisk-logo.png',
  partnerLogo: '../assets/minor-hotels-logo.png',
  titleText:   'Orbisk × Minor Hotels',
  bodyText:    "AI-powered food waste intelligence, now live in Minor Hotels' kitchens.",
  accentColor: '#1F4D4A',
  totalDuration: 5400,  // ms — total animation + hold
};

/* ═══════════════════════════════════════════════════════════════════════════
   Logo recoloring: loads a PNG and fills all non-transparent pixels with
   the target hex color, preserving per-pixel alpha.
   ═══════════════════════════════════════════════════════════════════════════ */
function hexToRgb(hex) {
  const r = parseInt(hex.slice(1,3), 16);
  const g = parseInt(hex.slice(3,5), 16);
  const b = parseInt(hex.slice(5,7), 16);
  return { r, g, b };
}

function recolorPng(src, targetHex, canvasEl, maxW, maxH) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => {
      const scale = Math.min(maxW / img.naturalWidth, maxH / img.naturalHeight, 1);
      const w = Math.round(img.naturalWidth  * scale);
      const h = Math.round(img.naturalHeight * scale);

      canvasEl.width  = w;
      canvasEl.height = h;
      const ctx = canvasEl.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);

      const { r, g, b } = hexToRgb(targetHex);
      const imageData = ctx.getImageData(0, 0, w, h);
      const d = imageData.data;

      for (let i = 0; i < d.length; i += 4) {
        if (d[i+3] > 8) {   // non-transparent pixel
          d[i]   = r;
          d[i+1] = g;
          d[i+2] = b;
          // alpha preserved
        }
      }
      ctx.putImageData(imageData, 0, 0);
      resolve();
    };
    img.onerror = () => {
      /* Graceful fallback: render placeholder text so the animation still runs */
      console.warn('Logo not found:', src);
      canvasEl.width  = maxW;
      canvasEl.height = 80;
      const ctx = canvasEl.getContext('2d');
      ctx.fillStyle = targetHex;
      ctx.font = 'bold 28px Poppins, sans-serif';
      ctx.textBaseline = 'middle';
      ctx.fillText(src.split('/').pop().replace('.png',''), 10, 40);
      resolve();
    };
    img.src = src;
  });
}

/* ═══════════════════════════════════════════════════════════════════════════
   Easing helpers
   ═══════════════════════════════════════════════════════════════════════════ */
function easeInOut(t) {
  return t < 0.5 ? 2*t*t : -1+(4-2*t)*t;
}
function easeOut(t) {
  return 1 - Math.pow(1 - t, 3);
}
function easeIn(t) {
  return t * t * t;
}

/* ═══════════════════════════════════════════════════════════════════════════
   Animation engine: tween(el, fromProps, toProps, duration, delay, easeFn)
   Supports: opacity, translateX, translateY, scaleX, scaleY, scale, height
   ═══════════════════════════════════════════════════════════════════════════ */
function tween(el, from, to, duration, delay, easeFn) {
  easeFn = easeFn || easeInOut;
  return new Promise(resolve => {
    setTimeout(() => {
      const start = performance.now();
      function frame(now) {
        let t = Math.min((now - start) / duration, 1);
        t = easeFn(t);

        const style = buildStyle(lerp(from, to, t));
        Object.assign(el.style, style);

        if (t < 1) {
          requestAnimationFrame(frame);
        } else {
          Object.assign(el.style, buildStyle(to));
          resolve();
        }
      }
      // apply from state immediately
      Object.assign(el.style, buildStyle(from));
      requestAnimationFrame(frame);
    }, delay);
  });
}

function lerp(from, to, t) {
  const result = {};
  for (const key in to) {
    result[key] = (from[key] ?? to[key]) + ((to[key] - (from[key] ?? to[key])) * t);
  }
  return result;
}

function buildStyle(props) {
  const transforms = [];
  const style = {};

  if ('translateX' in props) transforms.push(`translateX(${props.translateX}px)`);
  if ('translateY' in props) transforms.push(`translateY(${props.translateY}px)`);
  if ('scale'  in props) transforms.push(`scale(${props.scale})`);
  if ('scaleX' in props) transforms.push(`scaleX(${props.scaleX})`);

  if (transforms.length) style.transform = transforms.join(' ');
  if ('opacity' in props) style.opacity = props.opacity;
  if ('height'  in props) style.height  = props.height + 'px';

  return style;
}

function wait(ms) {
  return new Promise(r => setTimeout(r, ms));
}

/* ═══════════════════════════════════════════════════════════════════════════
   Text content
   ═══════════════════════════════════════════════════════════════════════════ */
document.getElementById('text-title').textContent = CONFIG.titleText;
document.getElementById('text-body').textContent  = CONFIG.bodyText;

/* ═══════════════════════════════════════════════════════════════════════════
   Main sequence
   ═══════════════════════════════════════════════════════════════════════════ */
async function runAnimation() {
  const orbisk  = document.getElementById('logo-orbisk');
  const partner = document.getElementById('logo-partner');
  const divider = document.getElementById('divider');
  const textBlock = document.getElementById('text-block');

  /* Load + recolor logos */
  await Promise.all([
    recolorPng(CONFIG.orbiskLogo,  CONFIG.accentColor, document.getElementById('canvas-orbisk'),  340, 100),
    recolorPng(CONFIG.partnerLogo, CONFIG.accentColor, document.getElementById('canvas-partner'), 340, 100),
  ]);

  /* ── Phase 1: Orbisk appears centred (0 → 600ms) ── */
  tween(orbisk,
    { opacity: 0, scale: 0.85, translateX: 0 },
    { opacity: 1, scale: 1.0,  translateX: 0 },
    600, 0, easeOut
  );

  await wait(600 + 500); // appear + hold centred 500ms

  /* ── Phase 2: Orbisk slides left (1100 → 1900ms) ── */
  /* The lockup is flex, so Orbisk will naturally sit left once divider + partner appear.
     We don't need to manually translate — we let the flex layout do it.
     Instead we animate the divider growing and partner fading in, which pushes Orbisk left
     via the natural reflow. We suppress that with a width-fixed approach using absolute
     positioning for the slide.  */

  /* Approach: animate orbisk translateX from 0 to -leftOffset.
     We'll measure after layout is stable. */
  const lockupRect  = document.getElementById('lockup').getBoundingClientRect();
  const orbiskRect  = orbisk.getBoundingClientRect();
  // Target left-edge x so that the whole lockup is centred when partner is added.
  // Estimate partner width ~ orbiskRect.width, divider ~ 193px (1.5 + 128 margin)
  const estLockupW  = orbiskRect.width + 193 + orbiskRect.width;
  const targetOrbiskCenterX = (1200 / 2) - (estLockupW / 2) + (orbiskRect.width / 2);
  const currentOrbiskCenterX = orbiskRect.left + orbiskRect.width / 2;
  const deltaX = targetOrbiskCenterX - currentOrbiskCenterX;

  tween(orbisk,
    { opacity: 1, scale: 1.0, translateX: 0 },
    { opacity: 1, scale: 1.0, translateX: deltaX },
    800, 0, easeInOut
  );

  await wait(400); // mid-slide

  /* ── Phase 3: Divider line grows in (1500 → 1900ms) ── */
  divider.style.opacity = '0';
  divider.style.height  = '0px';

  tween(divider,
    { opacity: 0, height: 0 },
    { opacity: 1, height: 100 },
    500, 0, easeInOut
  );

  await wait(200); // slight overlap with divider

  /* ── Phase 4: Partner logo fades + scales in (1700 → 2500ms) ── */
  tween(partner,
    { opacity: 0, scale: 0.88, translateX: 30 },
    { opacity: 1, scale: 1.0,  translateX: deltaX },
    700, 0, easeOut
  );

  await wait(1100); // wait for partner to finish + brief hold

  /* ── Phase 5: Text fades up in (2800 → 3400ms) ── */
  tween(textBlock,
    { opacity: 0, translateY: 14 },
    { opacity: 1, translateY: 0  },
    600, 0, easeOut
  );

  /* Hold on end frame — animation complete signal for Playwright */
  await wait(2200);
  document.documentElement.dataset.animationDone = 'true';
}

/* Start once DOM fonts are loaded */
document.fonts.ready.then(runAnimation);
</script>
</body>
</html>
