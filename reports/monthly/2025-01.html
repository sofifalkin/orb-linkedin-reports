<head>

<style>
  :root {
    --color-primary: #1a7a4a;
    --color-accent:  #f4b942;
    --color-forest:  #255653;
    --color-orange:  #F16622;
    --color-bg:      #f9f9f7;
    --color-surface: #ffffff;
    --color-text:    #1a1a1a;
    --color-muted:   #6b7280;
    --color-border:  #e5e7eb;
    --font: 'Inter', system-ui, sans-serif;
    --radius: 8px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font); background: var(--color-bg); color: var(--color-text); line-height: 1.6; padding: 2rem; }

  /* Nav */
  .top-nav {
    background: var(--color-forest);
    padding: 0 2rem;
    display: flex;
    align-items: center;
    gap: 0;
    margin: -2rem -2rem 2rem -2rem;
  }
  .top-nav .nav-logo {
    font-size: 0.85rem; font-weight: 700; color: #fff;
    letter-spacing: 0.04em; text-transform: uppercase;
    padding: 1rem 1.5rem 1rem 0;
    border-right: 1px solid rgba(255,255,255,0.15);
    margin-right: 0.5rem; white-space: nowrap;
  }
  .top-nav a {
    display: inline-block; padding: 1rem 1.25rem;
    font-size: 0.82rem; font-weight: 500;
    color: rgba(255,255,255,0.7); text-decoration: none;
    border-bottom: 3px solid transparent;
    transition: color 0.15s, border-color 0.15s; white-space: nowrap;
  }
  .top-nav a:hover { color: #fff; border-bottom-color: rgba(255,255,255,0.4); }
  .top-nav a.active { color: #fff; border-bottom-color: var(--color-orange); font-weight: 600; }

  /* Header */
  .report-header { display: flex; align-items: center; gap: 1rem; margin-bottom: 2rem; padding-bottom: 1.5rem; border-bottom: 2px solid var(--color-border); }
  .report-header h1 { font-size: 1.5rem; font-weight: 700; }
  .report-header .period { color: var(--color-muted); font-size: 0.9rem; }

  /* KPI grid */
  .metrics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
  .metric-card { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius); padding: 1.25rem; }
  .metric-card .label { font-size: 0.75rem; color: var(--color-muted); text-transform: uppercase; letter-spacing: 0.05em; }
  .metric-card .value { font-size: 2rem; font-weight: 700; margin: 0.25rem 0; }
  .metric-card .delta { font-size: 0.8rem; }
  .metric-card .delta.up { color: var(--color-primary); }

  /* Section */
  .section { margin-bottom: 2.5rem; }
  .section h2 { font-size: 1.1rem; font-weight: 600; margin-bottom: 1rem; }

  /* Table */
  table { width: 100%; border-collapse: collapse; background: var(--color-surface); border-radius: var(--radius); overflow: hidden; border: 1px solid var(--color-border); font-size: 0.875rem; }
  th { background: var(--color-bg); text-align: left; padding: 0.75rem 1rem; font-weight: 600; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--color-muted); border-bottom: 1px solid var(--color-border); }
  td { padding: 0.75rem 1rem; border-bottom: 1px solid var(--color-border); }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: var(--color-bg); }
  .excerpt-cell { max-width: 320px; font-size: 0.82rem; }
</style>

<body>

<nav class="top-nav">
  <div class="nav-logo">Orbisk Reports</div>
  <a href="./2025-01.html" class="active">Company Page</a>
  <a href="../founders/2025-01.html">Founders</a>
  <a href="../ambassadors/2025-01.html">Ambassadors</a>
</nav>

<header class="report-header">
  <div>
    <h1>Orbisk LinkedIn Report</h1>
    <div class="period">January 2025 · Company Page</div>
  </div>
</header>

<section class="metrics-grid">
  <div class="metric-card">
    <div class="label">Total Followers</div>
    <div class="value" id="followers-total">—</div>
  </div>
  <div class="metric-card">
    <div class="label">New Followers</div>
    <div class="value" id="followers-gained">—</div>
    <div class="delta up" id="followers-delta"></div>
  </div>
  <div class="metric-card">
    <div class="label">Impressions</div>
    <div class="value" id="impressions">—</div>
  </div>
  <div class="metric-card">
    <div class="label">Engagement Rate</div>
    <div class="value" id="engagement-rate">—</div>
  </div>
  <div class="metric-card">
    <div class="label">Unique Visitors</div>
    <div class="value" id="unique-visitors">—</div>
  </div>
</section>

<section class="section">
  <h2>Top Posts</h2>
  <table>
    <thead>
      <tr>
        <th>Post</th>
        <th>Date</th>
        <th>Impressions</th>
        <th>Reactions</th>
        <th>Comments</th>
        <th>Shares</th>
        <th>Eng. Rate</th>
      </tr>
    </thead>
    <tbody id="top-posts-body"></tbody>
  </table>
</section>

<script>
  var m = DATA.page_metrics;

  document.getElementById('followers-total').textContent   = m.followers_total.toLocaleString();
  document.getElementById('followers-gained').textContent  = '+' + m.followers_gained.toLocaleString();
  document.getElementById('impressions').textContent       = m.impressions.toLocaleString();
  document.getElementById('engagement-rate').textContent   = m.engagement_rate + '%';
  document.getElementById('unique-visitors').textContent   = m.unique_visitors.toLocaleString();

  var tbody = document.getElementById('top-posts-body');
  DATA.top_posts.forEach(function(p) {
    var tr = document.createElement('tr');
    tr.innerHTML =
      '<td class="excerpt-cell">' + p.text.slice(0, 80) + '…</td>' +
      '<td style="white-space:nowrap;color:var(--color-muted);font-size:0.8rem">' + p.date + '</td>' +
      '<td>' + p.impressions.toLocaleString() + '</td>' +
      '<td>' + p.reactions + '</td>' +
      '<td>' + p.comments + '</td>' +
      '<td>' + p.shares + '</td>' +
      '<td>' + p.engagement_rate + '%</td>';
    tbody.appendChild(tr);
  });
</script>

</body>
</html>
