<style>
  :root {
    --forest:  #255653;
    --night:   #1F4D4A;
    --cream:   #FAF6EB;
    --orange:  #F16622;
    --lime:    #5FC433;
    --honey:   #FFC963;
    --text:    #1a1a1a;
    --muted:   #5a6a68;
    --border:  #dde8e6;
    --surface: #ffffff;
    --font:    'Poppins', system-ui, sans-serif;
    --radius:  10px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font); background: var(--cream); color: var(--text); line-height: 1.6; }

  /* ── Nav ── */
  .top-nav { background: var(--night); padding: 0 2.5rem; display: flex; align-items: center; }
  .top-nav .nav-logo { font-size: 0.8rem; font-weight: 700; color: #fff; letter-spacing: 0.08em; text-transform: uppercase; padding: 1rem 1.5rem 1rem 0; border-right: 1px solid rgba(255,255,255,0.12); margin-right: 0.5rem; white-space: nowrap; }
  .top-nav a { display: inline-block; padding: 1rem 1.1rem; font-size: 0.78rem; font-weight: 500; color: rgba(255,255,255,0.6); text-decoration: none; border-bottom: 3px solid transparent; transition: color 0.15s, border-color 0.15s; white-space: nowrap; }
  .top-nav a:hover  { color: #fff; border-bottom-color: rgba(255,255,255,0.35); }
  .top-nav a.active { color: #fff; border-bottom-color: var(--orange); font-weight: 600; }

  /* ── Page shell ── */
  .page { padding: 2.5rem; max-width: 1100px; margin: 0 auto; }

  /* ── Report header ── */
  .report-header { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 2rem; padding-bottom: 1.5rem; border-bottom: 2px solid var(--border); gap: 1rem; flex-wrap: wrap; }
  .report-header h1 { font-size: 1.75rem; font-weight: 800; color: var(--forest); line-height: 1.15; }
  .report-header h1 span { display: block; font-size: 0.8rem; font-weight: 500; color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 0.3rem; }
  .report-badge { background: var(--forest); color: #fff; font-size: 0.72rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; padding: 0.35rem 0.9rem; border-radius: 999px; }

  /* ── Summary hero ── */
  .summary-hero {
    background: var(--forest);
    border-radius: var(--radius);
    padding: 1.5rem 2rem;
    display: flex;
    gap: 1.5rem;
    flex-wrap: wrap;
    align-items: center;
    margin-bottom: 2rem;
  }
  .summary-pill {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 0.82rem;
    color: rgba(255,255,255,0.65);
  }
  .summary-pill strong { color: #fff; font-weight: 700; font-size: 1rem; }
  .summary-divider { width: 1px; height: 1.5rem; background: rgba(255,255,255,0.15); }

  /* ── Section headings ── */
  .section { margin-bottom: 2.5rem; }
  .section-heading { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 1.25rem; }
  .section-heading h2 { font-size: 1.05rem; font-weight: 700; color: var(--text); text-transform: uppercase; letter-spacing: 0.05em; }
  .section-heading::before { content: ''; display: block; width: 4px; height: 1.25rem; background: var(--orange); border-radius: 2px; flex-shrink: 0; }

  /* ── Tier filter ── */
  .filter-row { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 1.5rem; }
  .filter-btn { padding: 0.4rem 1rem; border: 2px solid var(--border); border-radius: 999px; background: var(--surface); color: var(--muted); font-size: 0.78rem; font-weight: 600; cursor: pointer; font-family: var(--font); transition: all 0.15s; }
  .filter-btn:hover  { border-color: var(--forest); color: var(--forest); }
  .filter-btn.active { background: var(--forest); border-color: var(--forest); color: #fff; }

  /* ── Creator cards ── */
  .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 1.25rem; margin-bottom: 2.5rem; }
  .creator-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.25rem; display: flex; flex-direction: column; gap: 1rem; transition: box-shadow 0.15s, transform 0.15s; }
  .creator-card:hover { box-shadow: 0 6px 20px rgba(37,86,83,0.12); transform: translateY(-2px); }
  .creator-card.hidden { display: none; }

  .card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 0.75rem; }
  .card-identity { display: flex; gap: 0.75rem; align-items: flex-start; }
  .creator-avatar { width: 44px; height: 44px; border-radius: 50%; background: var(--forest); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.95rem; flex-shrink: 0; }
  .creator-name    { font-weight: 700; font-size: 0.95rem; line-height: 1.2; color: var(--text); }
  .creator-role    { font-size: 0.73rem; color: var(--muted); margin-top: 0.1rem; }
  .creator-company { font-size: 0.7rem; color: var(--muted); }

  /* Tier badges */
  .tier-badge { font-size: 0.63rem; font-weight: 700; padding: 0.2rem 0.55rem; border-radius: 4px; text-transform: uppercase; letter-spacing: 0.06em; white-space: nowrap; }
  .tier-Nano  { background: #f0fdf4; color: #16a34a; border: 1px solid #bbf7d0; }
  .tier-Micro { background: #eff6ff; color: #2563eb; border: 1px solid #bfdbfe; }
  .tier-Mid   { background: #fdf4ff; color: #9333ea; border: 1px solid #e9d5ff; }
  .tier-Macro { background: #fff7ed; color: #ea580c; border: 1px solid #fed7aa; }

  /* Status badges */
  .status-badge { font-size: 0.63rem; padding: 0.15rem 0.5rem; border-radius: 4px; font-weight: 600; }
  .status-not  { background: #f3f4f6; color: var(--muted); }
  .status-sent { background: #fefce8; color: #854d0e; }
  .status-live { background: #dcfce7; color: #15803d; }

  /* Card stats */
  .card-stats { display: grid; grid-template-columns: repeat(3, 1fr); padding: 0.75rem 0; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
  .stat { text-align: center; }
  .stat .s-val { font-size: 1.05rem; font-weight: 700; color: var(--forest); }
  .stat .s-lbl { font-size: 0.62rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; margin-top: 0.1rem; }

  /* Fit score */
  .fit-row { display: flex; align-items: center; gap: 0.75rem; }
  .fit-label { font-size: 0.72rem; color: var(--muted); white-space: nowrap; }
  .fit-track { flex: 1; height: 7px; background: var(--border); border-radius: 4px; overflow: hidden; }
  .fit-fill  { height: 100%; border-radius: 4px; background: linear-gradient(90deg, var(--forest), var(--lime)); }
  .fit-score-val { font-size: 0.85rem; font-weight: 700; color: var(--forest); white-space: nowrap; }

  /* Topic chips */
  .topic-chips { display: flex; flex-wrap: wrap; gap: 0.35rem; }
  .topic-chip { font-size: 0.67rem; padding: 0.15rem 0.5rem; border-radius: 4px; font-weight: 500; background: #f0f4f3; color: var(--muted); }
  .topic-chip.match { background: #e6f4e6; color: #1a5c1a; }
  .fit-notes { font-size: 0.78rem; color: var(--muted); line-height: 1.55; }

  /* ── Coverage matrix ── */
  .matrix-wrap { border-radius: var(--radius); overflow: hidden; border: 1px solid var(--border); overflow-x: auto; }
  .coverage-table { min-width: 560px; width: 100%; border-collapse: collapse; font-size: 0.85rem; }
  .coverage-table thead tr { background: var(--night); }
  .coverage-table th { padding: 0.85rem 1rem; font-size: 0.68rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: rgba(255,255,255,0.7); text-align: center; }
  .coverage-table th:first-child { text-align: left; }
  .coverage-table tbody tr:nth-child(odd)  { background: var(--surface); }
  .coverage-table tbody tr:nth-child(even) { background: var(--cream); }
  .coverage-table tbody tr:last-child { border-top: 2px solid var(--border); background: var(--cream); }
  .coverage-table tbody tr:hover td { background: #eef5f4; }
  .coverage-table td { padding: 0.75rem 1rem; border-bottom: 1px solid var(--border); text-align: center; vertical-align: middle; }
  .coverage-table tbody tr:last-child td { border-bottom: none; }
  .coverage-table td:first-child { text-align: left; font-weight: 600; font-size: 0.82rem; }
  .theme-header { font-size: 0.72rem; font-weight: 600; color: rgba(255,255,255,0.85); max-width: 110px; line-height: 1.3; text-transform: none; letter-spacing: 0; }
  .coverage-dot   { display: inline-block; width: 18px; height: 18px; background: var(--lime); border-radius: 50%; }
  .coverage-empty { display: inline-block; width: 18px; height: 18px; background: var(--border); border-radius: 50%; }

  /* ── Ranking list ── */
  .ranking-list { display: flex; flex-direction: column; gap: 0.75rem; }
  .rank-row { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.1rem 1.5rem; display: flex; align-items: center; gap: 1.25rem; transition: box-shadow 0.15s; }
  .rank-row:hover { box-shadow: 0 4px 14px rgba(37,86,83,0.1); }
  .rank-number { font-size: 1.6rem; font-weight: 800; width: 2.2rem; flex-shrink: 0; text-align: center; color: var(--border); }
  .rank-row:nth-child(1) .rank-number { color: var(--honey); }
  .rank-row:nth-child(2) .rank-number { color: #9ca3af; }
  .rank-row:nth-child(3) .rank-number { color: #c97c3a; }
  .rank-info { flex: 1; }
  .rank-name { font-weight: 700; font-size: 0.92rem; }
  .rank-sub  { font-size: 0.77rem; color: var(--muted); margin-top: 0.15rem; display: flex; align-items: center; gap: 0.4rem; flex-wrap: wrap; }
  .rank-rationale { font-size: 0.78rem; color: var(--muted); margin-top: 0.35rem; line-height: 1.55; }
  .rank-right { display: flex; flex-direction: column; align-items: flex-end; gap: 0.4rem; flex-shrink: 0; }
  .rank-score { font-size: 1.25rem; font-weight: 800; color: var(--forest); line-height: 1; }
  .rank-score-lbl { font-size: 0.62rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
</style>

<body>

<nav class="top-nav">
  <div class="nav-logo">Orbisk Reports</div>
  <a href="../monthly/2025-01.html">Company Page</a>
  <a href="../founders/2025-01.html">Founders</a>
  <a href="./2025-01.html" class="active">Ambassadors</a>
</nav>

<div class="page">

  <header class="report-header">
    <h1>
      <span>Orbisk · LinkedIn</span>
      Creator &amp; Ambassador Benchmark
    </h1>
    <div class="report-badge">January 2025</div>
  </header>

  <div class="summary-hero" id="summary-hero"></div>

  <div class="section">
    <div class="section-heading"><h2>Creator Shortlist</h2></div>
    <div class="filter-row" id="tier-filters">
      <button class="filter-btn active" data-tier="all">All tiers</button>
      <button class="filter-btn" data-tier="Nano">Nano</button>
      <button class="filter-btn" data-tier="Micro">Micro</button>
      <button class="filter-btn" data-tier="Mid">Mid</button>
      <button class="filter-btn" data-tier="Macro">Macro</button>
    </div>
    <div class="cards-grid" id="cards-grid"></div>
  </div>

  <div class="section">
    <div class="section-heading"><h2>Topic Coverage</h2></div>
    <div class="matrix-wrap">
      <table class="coverage-table">
        <thead id="coverage-head"></thead>
        <tbody id="coverage-body"></tbody>
      </table>
    </div>
  </div>

  <div class="section">
    <div class="section-heading"><h2>Outreach Priority Ranking</h2></div>
    <div class="ranking-list" id="ranking-list"></div>
  </div>

</div>

<script>
  var creators = DATA.creators;
  var themes   = DATA.themes;
  var fmt = function(n) { return n >= 1000 ? (n / 1000).toFixed(1) + 'k' : String(n); };
  var statusClass = function(s) { return s === 'Live' ? 'status-live' : s === 'Contacted' ? 'status-sent' : 'status-not'; };

  /* Summary hero */
  var totalFollowers = creators.reduce(function(s, c) { return s + c.followers; }, 0);
  var avgEng = (creators.reduce(function(s, c) { return s + c.engagement_rate; }, 0) / creators.length).toFixed(1);
  var tiers  = creators.map(function(c) { return c.tier; }).filter(function(v, i, a) { return a.indexOf(v) === i; });
  document.getElementById('summary-hero').innerHTML =
    '<div class="summary-pill"><strong>' + creators.length + '</strong> creators shortlisted</div>' +
    '<div class="summary-divider"></div>' +
    '<div class="summary-pill">Combined reach <strong>' + (totalFollowers / 1000).toFixed(0) + 'k</strong></div>' +
    '<div class="summary-divider"></div>' +
    '<div class="summary-pill">Avg engagement rate <strong>' + avgEng + '%</strong></div>' +
    '<div class="summary-divider"></div>' +
    '<div class="summary-pill">Tiers: <strong>' + tiers.join(', ') + '</strong></div>';

  /* Creator cards */
  var grid = document.getElementById('cards-grid');
  creators.forEach(function(c) {
    var initials = c.name.split(' ').map(function(w) { return w[0]; }).join('').slice(0, 2).toUpperCase();
    var card = document.createElement('div');
    card.className = 'creator-card';
    card.dataset.tier = c.tier;
    card.innerHTML =
      '<div class="card-top">' +
        '<div class="card-identity">' +
          '<div class="creator-avatar">' + initials + '</div>' +
          '<div><div class="creator-name">' + c.name + '</div><div class="creator-role">' + c.role + '</div><div class="creator-company">' + c.company + '</div></div>' +
        '</div>' +
        '<div style="display:flex;flex-direction:column;align-items:flex-end;gap:0.35rem">' +
          '<span class="tier-badge tier-' + c.tier + '">' + c.tier + '</span>' +
          '<span class="status-badge ' + statusClass(c.outreach_status) + '">' + c.outreach_status + '</span>' +
        '</div>' +
      '</div>' +
      '<div class="card-stats">' +
        '<div class="stat"><div class="s-val">' + fmt(c.followers) + '</div><div class="s-lbl">Followers</div></div>' +
        '<div class="stat"><div class="s-val">' + c.engagement_rate + '%</div><div class="s-lbl">Eng. Rate</div></div>' +
        '<div class="stat"><div class="s-val">' + fmt(c.avg_impressions_per_post) + '</div><div class="s-lbl">Avg Impr.</div></div>' +
      '</div>' +
      '<div class="fit-row">' +
        '<span class="fit-label">Fit score</span>' +
        '<div class="fit-track"><div class="fit-fill" style="width:' + (c.fit_score * 10) + '%"></div></div>' +
        '<span class="fit-score-val">' + c.fit_score + ' / 10</span>' +
      '</div>' +
      '<div class="topic-chips">' +
        themes.map(function(t) {
          return '<span class="topic-chip' + (c.topics.indexOf(t) !== -1 ? ' match' : '') + '">' + t + '</span>';
        }).join('') +
      '</div>' +
      '<div class="fit-notes">' + c.fit_notes + '</div>';
    grid.appendChild(card);
  });

  /* Tier filter */
  document.getElementById('tier-filters').addEventListener('click', function(e) {
    var btn = e.target.closest('.filter-btn');
    if (!btn) return;
    document.querySelectorAll('.filter-btn').forEach(function(b) { b.classList.remove('active'); });
    btn.classList.add('active');
    var tier = btn.dataset.tier;
    document.querySelectorAll('.creator-card').forEach(function(card) {
      card.classList.toggle('hidden', tier !== 'all' && card.dataset.tier !== tier);
    });
  });

  /* Coverage matrix */
  document.getElementById('coverage-head').innerHTML =
    '<tr><th style="text-align:left">Creator</th>' +
    themes.map(function(t) { return '<th><div class="theme-header">' + t + '</div></th>'; }).join('') +
    '<th><div class="theme-header">Coverage</div></th></tr>';

  var tbody = document.getElementById('coverage-body');
  creators.forEach(function(c) {
    var coverCount = themes.filter(function(t) { return c.topics.indexOf(t) !== -1; }).length;
    var tr = document.createElement('tr');
    tr.innerHTML =
      '<td>' + c.name + '</td>' +
      themes.map(function(t) {
        return '<td>' + (c.topics.indexOf(t) !== -1 ? '<span class="coverage-dot"></span>' : '<span class="coverage-empty"></span>') + '</td>';
      }).join('') +
      '<td style="font-weight:700;font-size:0.82rem;color:var(--forest)">' + coverCount + '/' + themes.length + '</td>';
    tbody.appendChild(tr);
  });

  var totals = document.createElement('tr');
  totals.innerHTML =
    '<td style="font-size:0.72rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:0.05em">Creators covering</td>' +
    themes.map(function(t) {
      var n = creators.filter(function(c) { return c.topics.indexOf(t) !== -1; }).length;
      return '<td style="font-size:0.85rem;font-weight:700;color:var(--text)">' + n + '</td>';
    }).join('') +
    '<td></td>';
  tbody.appendChild(totals);

  /* Ranking */
  var ranked = creators.slice().sort(function(a, b) { return b.fit_score - a.fit_score; });
  var list = document.getElementById('ranking-list');
  ranked.forEach(function(c, i) {
    var row = document.createElement('div');
    row.className = 'rank-row';
    row.innerHTML =
      '<div class="rank-number">' + (i + 1) + '</div>' +
      '<div class="rank-info">' +
        '<div class="rank-name">' + c.name + '</div>' +
        '<div class="rank-sub">' + c.role + ' · ' + c.company + ' <span class="tier-badge tier-' + c.tier + '">' + c.tier + '</span></div>' +
        '<div class="rank-rationale">' + c.fit_notes + '</div>' +
      '</div>' +
      '<div class="rank-right">' +
        '<span class="rank-score">' + c.fit_score + '</span>' +
        '<span class="rank-score-lbl">fit score</span>' +
        '<span class="status-badge ' + statusClass(c.outreach_status) + '">' + c.outreach_status + '</span>' +
      '</div>';
    list.appendChild(row);
  });
</script>

</body>
</html>
