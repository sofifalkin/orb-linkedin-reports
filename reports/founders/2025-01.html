<style>
  :root {
    --color-primary: #1a7a4a;
    --color-accent:  #f4b942;
    --color-forest:  #255653;
    --color-orange:  #F16622;
    --color-bg:      #f9f9f7;
    --color-surface: #ffffff;
    --color-text:    #1a1a1a;
    --color-muted:   #6b7280;
    --color-border:  #e5e7eb;
    --font: 'Inter', system-ui, sans-serif;
    --radius: 8px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font); background: var(--color-bg); color: var(--color-text); line-height: 1.6; padding: 2rem; }

  /* Nav */
  .top-nav { background: var(--color-forest); padding: 0 2rem; display: flex; align-items: center; gap: 0; margin: -2rem -2rem 2rem -2rem; }
  .top-nav .nav-logo { font-size: 0.85rem; font-weight: 700; color: #fff; letter-spacing: 0.04em; text-transform: uppercase; padding: 1rem 1.5rem 1rem 0; border-right: 1px solid rgba(255,255,255,0.15); margin-right: 0.5rem; white-space: nowrap; }
  .top-nav a { display: inline-block; padding: 1rem 1.25rem; font-size: 0.82rem; font-weight: 500; color: rgba(255,255,255,0.7); text-decoration: none; border-bottom: 3px solid transparent; transition: color 0.15s, border-color 0.15s; white-space: nowrap; }
  .top-nav a:hover { color: #fff; border-bottom-color: rgba(255,255,255,0.4); }
  .top-nav a.active { color: #fff; border-bottom-color: var(--color-orange); font-weight: 600; }

  /* Header */
  .report-header { display: flex; align-items: center; gap: 1rem; margin-bottom: 2rem; padding-bottom: 1.5rem; border-bottom: 2px solid var(--color-border); }
  .report-header h1 { font-size: 1.5rem; font-weight: 700; }
  .report-header .period { color: var(--color-muted); font-size: 0.9rem; }

  /* Tabs */
  .founder-tabs { display: flex; gap: 0.5rem; margin-bottom: 2rem; }
  .tab-btn { padding: 0.5rem 1.25rem; border: 1px solid var(--color-border); border-radius: 999px; background: var(--color-surface); color: var(--color-muted); font-size: 0.875rem; font-weight: 500; cursor: pointer; font-family: var(--font); transition: all 0.15s; }
  .tab-btn:hover { border-color: var(--color-primary); color: var(--color-primary); }
  .tab-btn.active { background: var(--color-primary); border-color: var(--color-primary); color: #fff; }

  /* Panels */
  .founder-panel { display: none; }
  .founder-panel.active { display: block; }

  /* Founder meta */
  .founder-meta { display: flex; align-items: center; gap: 1rem; margin-bottom: 1.75rem; }
  .founder-avatar { width: 48px; height: 48px; border-radius: 50%; background: var(--color-primary); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 1.1rem; flex-shrink: 0; }
  .founder-meta h2 { font-size: 1.15rem; font-weight: 700; line-height: 1.2; }
  .founder-meta .title-tag { font-size: 0.78rem; color: var(--color-muted); margin-top: 0.15rem; }

  /* KPI grid */
  .metrics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
  .metric-card { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius); padding: 1.25rem; }
  .metric-card .label { font-size: 0.75rem; color: var(--color-muted); text-transform: uppercase; letter-spacing: 0.05em; }
  .metric-card .value { font-size: 2rem; font-weight: 700; margin: 0.25rem 0; }
  .metric-card.best { border-top: 3px solid var(--color-accent); }
  .metric-card.best .value { font-size: 1.1rem; line-height: 1.4; }

  /* Section */
  .section { margin-bottom: 2.5rem; }
  .section h2 { font-size: 1.1rem; font-weight: 600; margin-bottom: 1rem; }

  /* Table */
  table { width: 100%; border-collapse: collapse; background: var(--color-surface); border-radius: var(--radius); overflow: hidden; border: 1px solid var(--color-border); font-size: 0.875rem; }
  th { background: var(--color-bg); text-align: left; padding: 0.75rem 1rem; font-weight: 600; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--color-muted); border-bottom: 1px solid var(--color-border); }
  td { padding: 0.75rem 1rem; border-bottom: 1px solid var(--color-border); }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: var(--color-bg); }

  /* Format badges */
  .format-badge { display: inline-block; font-size: 0.7rem; padding: 0.1rem 0.45rem; border-radius: 4px; font-weight: 600; letter-spacing: 0.03em; }
  .format-Text     { background: #eff6ff; color: #3b82f6; }
  .format-Carousel { background: #fdf4ff; color: #a855f7; }
  .format-Image    { background: #fff7ed; color: #f97316; }
  .format-Video    { background: #f0fdf4; color: #22c55e; }
  .format-Article  { background: #fefce8; color: #ca8a04; }

  /* Excerpt cell */
  td.excerpt-cell { max-width: 280px; }
  td.excerpt-cell span { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-size: 0.82rem; line-height: 1.45; }

  /* Engagement bar */
  .eng-bar { display: flex; align-items: center; gap: 0.5rem; font-size: 0.82rem; }
  .eng-bar-track { flex: 1; height: 5px; background: var(--color-border); border-radius: 3px; overflow: hidden; }
  .eng-bar-fill { height: 100%; background: var(--color-primary); border-radius: 3px; }

  /* Top 3 spotlight */
  .spotlight-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1rem; }
  .spotlight-card { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius); padding: 1.25rem; position: relative; }
  .spotlight-rank { position: absolute; top: -10px; left: 1rem; background: var(--color-accent); color: #1a1a1a; font-size: 0.7rem; font-weight: 700; padding: 0.15rem 0.5rem; border-radius: 999px; text-transform: uppercase; letter-spacing: 0.05em; }
  .spotlight-card .excerpt { font-size: 0.875rem; color: var(--color-text); margin: 0.75rem 0 1rem; line-height: 1.5; }
  .spotlight-stats { display: flex; gap: 1.25rem; font-size: 0.78rem; color: var(--color-muted); }
  .spotlight-stats span strong { color: var(--color-text); }
  .spotlight-card .post-meta { font-size: 0.75rem; color: var(--color-muted); display: flex; gap: 0.75rem; margin-bottom: 0.25rem; }

  /* Topic distribution */
  .topic-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 0.75rem; }
  .topic-row { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius); padding: 0.9rem 1rem; }
  .topic-row .topic-label { display: flex; justify-content: space-between; font-size: 0.8rem; margin-bottom: 0.5rem; }
  .topic-row .topic-label .name { font-weight: 600; }
  .topic-row .topic-label .count { color: var(--color-muted); }
  .topic-bar-track { height: 6px; background: var(--color-border); border-radius: 3px; overflow: hidden; }
  .topic-bar-fill { height: 100%; background: var(--color-primary); border-radius: 3px; }
</style>

<body>

<nav class="top-nav">
  <div class="nav-logo">Orbisk Reports</div>
  <a href="../monthly/2025-01.html">Company Page</a>
  <a href="./2025-01.html" class="active">Founders</a>
  <a href="../ambassadors/2025-01.html">Ambassadors</a>
</nav>

<header class="report-header">
  <div>
    <h1>Orbisk Founder Post Tracker</h1>
    <div class="period">January 2025 · Founder Posts</div>
  </div>
</header>

<div class="founder-tabs" id="tabs"></div>
<div id="panels"></div>

<script>
  var tabs   = document.getElementById('tabs');
  var panels = document.getElementById('panels');

  DATA.founders.forEach(function(founder, fi) {
    /* Tab button */
    var btn = document.createElement('button');
    btn.className = 'tab-btn' + (fi === 0 ? ' active' : '');
    btn.textContent = founder.name;
    btn.dataset.index = fi;
    tabs.appendChild(btn);

    /* Derived metrics */
    var posts = founder.posts || [];
    var totalImpressions = posts.reduce(function(s, p) { return s + (p.impressions || 0); }, 0);
    var totalEngagement  = posts.reduce(function(s, p) { return s + (p.reactions || 0) + (p.comments || 0) + (p.shares || 0); }, 0);
    var avgEng = posts.length
      ? (posts.reduce(function(s, p) {
          var eng = (p.reactions || 0) + (p.comments || 0) + (p.shares || 0);
          return s + (p.impressions ? eng / p.impressions * 100 : 0);
        }, 0) / posts.length).toFixed(1)
      : '—';

    var sorted = posts.slice().sort(function(a, b) {
      var eA = (a.reactions || 0) + (a.comments || 0) + (a.shares || 0);
      var eB = (b.reactions || 0) + (b.comments || 0) + (b.shares || 0);
      return eB - eA;
    });
    var bestPost = sorted[0];
    var top3     = sorted.slice(0, 3);
    var maxEng   = sorted[0] ? (sorted[0].reactions || 0) + (sorted[0].comments || 0) + (sorted[0].shares || 0) : 1;

    /* Topic counts */
    var topicCounts = {};
    posts.forEach(function(p) {
      var t = p.topic || 'Other';
      topicCounts[t] = (topicCounts[t] || 0) + 1;
    });
    var topicEntries = Object.keys(topicCounts).map(function(k) { return [k, topicCounts[k]]; });
    topicEntries.sort(function(a, b) { return b[1] - a[1]; });

    var initials = founder.name.split(' ').map(function(w) { return w[0]; }).join('').slice(0, 2).toUpperCase();

    /* Build post table rows */
    var postRows = posts.length ? posts.map(function(p) {
      var eng    = (p.reactions || 0) + (p.comments || 0) + (p.shares || 0);
      var barPct = Math.round(eng / maxEng * 100);
      return '<tr>' +
        '<td style="white-space:nowrap;color:var(--color-muted);font-size:0.8rem">' + (p.date || '') + '</td>' +
        '<td class="excerpt-cell"><span>' + (p.excerpt || '') + '</span></td>' +
        '<td><span class="format-badge format-' + (p.format || 'Text') + '">' + (p.format || '—') + '</span></td>' +
        '<td style="font-size:0.82rem">' + (p.topic || '—') + '</td>' +
        '<td>' + (p.impressions || 0).toLocaleString() + '</td>' +
        '<td>' + (p.reactions || '—') + '</td>' +
        '<td>' + (p.comments  || '—') + '</td>' +
        '<td>' + (p.shares    || '—') + '</td>' +
        '<td><div class="eng-bar"><span>' + eng + '</span><div class="eng-bar-track"><div class="eng-bar-fill" style="width:' + barPct + '%"></div></div></div></td>' +
        '</tr>';
    }).join('') : '<tr><td colspan="9" style="color:var(--color-muted);text-align:center;padding:2rem;">No posts this period</td></tr>';

    /* Build top 3 cards */
    var spotlightCards = top3.map(function(p, i) {
      var eng   = (p.reactions || 0) + (p.comments || 0) + (p.shares || 0);
      var label = ['#1 Best', '#2', '#3'][i];
      var rate  = p.impressions ? (eng / p.impressions * 100).toFixed(1) : '—';
      return '<div class="spotlight-card">' +
        '<div class="spotlight-rank">' + label + '</div>' +
        '<div class="post-meta"><span>' + (p.date || '') + '</span><span class="format-badge format-' + (p.format || 'Text') + '">' + (p.format || '') + '</span><span>' + (p.topic || '') + '</span></div>' +
        '<p class="excerpt">"' + (p.excerpt || '') + '"</p>' +
        '<div class="spotlight-stats">' +
          '<span><strong>' + (p.impressions || 0).toLocaleString() + '</strong> impressions</span>' +
          '<span><strong>' + eng + '</strong> engagements</span>' +
          '<span><strong>' + rate + '%</strong> eng. rate</span>' +
        '</div></div>';
    }).join('');

    /* Build topic bars */
    var topicBars = topicEntries.map(function(entry) {
      var topic = entry[0]; var count = entry[1];
      var pct   = Math.round(count / posts.length * 100);
      return '<div class="topic-row">' +
        '<div class="topic-label"><span class="name">' + topic + '</span><span class="count">' + count + ' post' + (count > 1 ? 's' : '') + '</span></div>' +
        '<div class="topic-bar-track"><div class="topic-bar-fill" style="width:' + pct + '%"></div></div>' +
        '</div>';
    }).join('');

    /* Panel */
    var panel = document.createElement('div');
    panel.className = 'founder-panel' + (fi === 0 ? ' active' : '');
    panel.id = 'panel-' + fi;
    panel.innerHTML =
      '<div class="founder-meta">' +
        '<div class="founder-avatar">' + initials + '</div>' +
        '<div><h2>' + founder.name + '</h2><div class="title-tag">' + (founder.title || '') + '</div></div>' +
      '</div>' +
      '<div class="metrics-grid">' +
        '<div class="metric-card"><div class="label">Posts Published</div><div class="value">' + posts.length + '</div></div>' +
        '<div class="metric-card"><div class="label">Total Impressions</div><div class="value">' + totalImpressions.toLocaleString() + '</div></div>' +
        '<div class="metric-card"><div class="label">Total Engagement</div><div class="value">' + totalEngagement.toLocaleString() + '</div></div>' +
        '<div class="metric-card"><div class="label">Avg Eng. Rate</div><div class="value">' + avgEng + '%</div></div>' +
        '<div class="metric-card best"><div class="label">Best Post</div><div class="value">' + (bestPost ? '"' + bestPost.excerpt.slice(0, 48) + '…"' : '—') + '</div></div>' +
      '</div>' +
      '<div class="section"><h2>Post Performance</h2>' +
        '<table><thead><tr><th>Date</th><th>Post</th><th>Format</th><th>Topic</th><th>Impressions</th><th>Reactions</th><th>Comments</th><th>Shares</th><th>Total Eng.</th></tr></thead>' +
        '<tbody>' + postRows + '</tbody></table>' +
      '</div>' +
      '<div class="section"><h2>Top 3 Posts</h2><div class="spotlight-grid">' + spotlightCards + '</div></div>' +
      '<div class="section"><h2>Topic Distribution</h2><div class="topic-grid">' + topicBars + '</div></div>';

    panels.appendChild(panel);
  });

  /* Tab switching */
  tabs.addEventListener('click', function(e) {
    var btn = e.target.closest('.tab-btn');
    if (!btn) return;
    document.querySelectorAll('.tab-btn').forEach(function(b) { b.classList.remove('active'); });
    document.querySelectorAll('.founder-panel').forEach(function(p) { p.classList.remove('active'); });
    btn.classList.add('active');
    document.getElementById('panel-' + btn.dataset.index).classList.add('active');
  });
</script>

</body>
</html>
