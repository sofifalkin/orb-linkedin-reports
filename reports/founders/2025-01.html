  "founders": [

      "posts": [

<style>
  :root {
    --forest:  #255653;
    --night:   #1F4D4A;
    --cream:   #FAF6EB;
    --orange:  #F16622;
    --lime:    #5FC433;
    --honey:   #FFC963;
    --text:    #1a1a1a;
    --muted:   #5a6a68;
    --border:  #dde8e6;
    --surface: #ffffff;
    --font:    'Poppins', system-ui, sans-serif;
    --radius:  10px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font); background: var(--cream); color: var(--text); line-height: 1.6; }

  /* ── Nav ── */
  .top-nav { background: var(--night); padding: 0 2.5rem; display: flex; align-items: center; }
  .top-nav .nav-logo { font-size: 0.8rem; font-weight: 700; color: #fff; letter-spacing: 0.08em; text-transform: uppercase; padding: 1rem 1.5rem 1rem 0; border-right: 1px solid rgba(255,255,255,0.12); margin-right: 0.5rem; white-space: nowrap; }
  .top-nav a { display: inline-block; padding: 1rem 1.1rem; font-size: 0.78rem; font-weight: 500; color: rgba(255,255,255,0.6); text-decoration: none; border-bottom: 3px solid transparent; transition: color 0.15s, border-color 0.15s; white-space: nowrap; }
  .top-nav a:hover  { color: #fff; border-bottom-color: rgba(255,255,255,0.35); }
  .top-nav a.active { color: #fff; border-bottom-color: var(--orange); font-weight: 600; }

  /* ── Page shell ── */
  .page { padding: 2.5rem; max-width: 1100px; margin: 0 auto; }

  /* ── Report header ── */
  .report-header { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 2rem; padding-bottom: 1.5rem; border-bottom: 2px solid var(--border); gap: 1rem; flex-wrap: wrap; }
  .report-header h1 { font-size: 1.75rem; font-weight: 800; color: var(--forest); line-height: 1.15; }
  .report-header h1 span { display: block; font-size: 0.8rem; font-weight: 500; color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 0.3rem; }
  .report-badge { background: var(--forest); color: #fff; font-size: 0.72rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; padding: 0.35rem 0.9rem; border-radius: 999px; }

  /* ── Founder tabs ── */
  .founder-tabs { display: flex; gap: 0.5rem; margin-bottom: 2rem; }
  .tab-btn { padding: 0.5rem 1.4rem; border: 2px solid var(--border); border-radius: 999px; background: var(--surface); color: var(--muted); font-size: 0.82rem; font-weight: 600; cursor: pointer; font-family: var(--font); transition: all 0.15s; }
  .tab-btn:hover  { border-color: var(--forest); color: var(--forest); }
  .tab-btn.active { background: var(--forest); border-color: var(--forest); color: #fff; }

  /* ── Founder panels ── */
  .founder-panel { display: none; }
  .founder-panel.active { display: block; }

  /* ── Founder identity bar ── */
  .founder-identity {
    display: flex;
    align-items: center;
    gap: 1rem;
    background: var(--forest);
    border-radius: var(--radius);
    padding: 1.25rem 1.75rem;
    margin-bottom: 1.75rem;
  }
  .founder-avatar {
    width: 48px; height: 48px;
    border-radius: 50%;
    background: rgba(255,255,255,0.15);
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 1.1rem; flex-shrink: 0;
    border: 2px solid rgba(255,255,255,0.3);
  }
  .founder-identity h2 { font-size: 1.1rem; font-weight: 700; color: #fff; line-height: 1.2; }
  .founder-identity .title-tag { font-size: 0.75rem; color: rgba(255,255,255,0.6); margin-top: 0.1rem; }

  /* ── KPI hero strip ── */
  .kpi-strip {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 1rem;
    margin-bottom: 2rem;
  }
  .kpi-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.1rem 1.25rem; }
  .kpi-card .kpi-label { font-size: 0.65rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); margin-bottom: 0.4rem; }
  .kpi-card .kpi-value { font-size: 2rem; font-weight: 800; color: var(--forest); line-height: 1; }
  .kpi-card.best { border-top: 3px solid var(--honey); }
  .kpi-card.best .kpi-value { font-size: 1rem; line-height: 1.45; color: var(--text); }

  /* ── Section headings ── */
  .section { margin-bottom: 2.5rem; }
  .section-heading { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 1.25rem; }
  .section-heading h2 { font-size: 1.05rem; font-weight: 700; color: var(--text); text-transform: uppercase; letter-spacing: 0.05em; }
  .section-heading::before { content: ''; display: block; width: 4px; height: 1.25rem; background: var(--orange); border-radius: 2px; flex-shrink: 0; }

  /* ── Tables ── */
  .table-wrap { border-radius: var(--radius); overflow: hidden; border: 1px solid var(--border); }
  table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
  thead tr { background: var(--night); }
  th { padding: 0.85rem 1rem; text-align: left; font-size: 0.68rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: rgba(255,255,255,0.7); white-space: nowrap; }
  tbody tr:nth-child(odd)  { background: var(--surface); }
  tbody tr:nth-child(even) { background: var(--cream); }
  tbody tr:hover td { background: #eef5f4; }
  td { padding: 0.85rem 1rem; border-bottom: 1px solid var(--border); vertical-align: middle; }
  tbody tr:last-child td { border-bottom: none; }

  td.excerpt-cell { max-width: 280px; }
  td.excerpt-cell span { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-size: 0.82rem; line-height: 1.45; }
  .date-cell { white-space: nowrap; font-size: 0.78rem; color: var(--muted); font-weight: 500; }
  .num-cell  { font-weight: 600; text-align: right; }
  .eng-cell  { text-align: right; }

  /* Engagement bar */
  .eng-bar { display: flex; align-items: center; gap: 0.5rem; justify-content: flex-end; font-size: 0.82rem; font-weight: 600; }
  .eng-track { width: 44px; height: 5px; background: var(--border); border-radius: 3px; overflow: hidden; }
  .eng-fill  { height: 100%; background: var(--lime); border-radius: 3px; }

  /* Format badges */
  .format-badge { display: inline-block; font-size: 0.68rem; padding: 0.15rem 0.5rem; border-radius: 4px; font-weight: 600; letter-spacing: 0.03em; }
  .format-Text     { background: #eff6ff; color: #3b82f6; }
  .format-Carousel { background: #fdf4ff; color: #a855f7; }
  .format-Image    { background: #fff7ed; color: #f97316; }
  .format-Video    { background: #f0fdf4; color: #22c55e; }
  .format-Article  { background: #fefce8; color: #ca8a04; }

  /* ── Top 3 spotlight ── */
  .spotlight-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1rem; }
  .spotlight-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.25rem; position: relative; }
  .spotlight-rank { position: absolute; top: -10px; left: 1rem; background: var(--honey); color: #6b3a00; font-size: 0.68rem; font-weight: 700; padding: 0.15rem 0.55rem; border-radius: 999px; text-transform: uppercase; letter-spacing: 0.05em; }
  .spotlight-card .post-meta { font-size: 0.73rem; color: var(--muted); display: flex; gap: 0.6rem; align-items: center; margin-bottom: 0.5rem; flex-wrap: wrap; }
  .spotlight-card .excerpt { font-size: 0.875rem; color: var(--text); margin: 0.5rem 0 1rem; line-height: 1.55; }
  .spotlight-stats { display: flex; gap: 1.1rem; font-size: 0.78rem; color: var(--muted); flex-wrap: wrap; }
  .spotlight-stats span strong { color: var(--forest); }

  /* ── Topic distribution ── */
  .topic-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 0.75rem; }
  .topic-row { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 0.9rem 1rem; }
  .topic-label { display: flex; justify-content: space-between; font-size: 0.8rem; margin-bottom: 0.5rem; }
  .topic-label .name  { font-weight: 600; }
  .topic-label .count { color: var(--muted); }
  .topic-bar-track { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
  .topic-bar-fill  { height: 100%; background: var(--forest); border-radius: 3px; }
</style>

<body>

<nav class="top-nav">
  <div class="nav-logo">Orbisk Reports</div>
  <a href="../monthly/2025-01.html">Company Page</a>
  <a href="./2025-01.html" class="active">Founders</a>
  <a href="../ambassadors/2025-01.html">Ambassadors</a>
</nav>

<div class="page">

  <header class="report-header">
    <h1>
      <span>Orbisk · LinkedIn</span>
      Founder Post Tracker
    </h1>
    <div class="report-badge">January 2025</div>
  </header>

  <div class="founder-tabs" id="tabs"></div>
  <div id="panels"></div>

</div>

<script>
  var tabs   = document.getElementById('tabs');
  var panels = document.getElementById('panels');

  DATA.founders.forEach(function(founder, fi) {
    /* Tab */
    var btn = document.createElement('button');
    btn.className = 'tab-btn' + (fi === 0 ? ' active' : '');
    btn.textContent = founder.name;
    btn.dataset.index = fi;
    tabs.appendChild(btn);

    /* Metrics */
    var posts = founder.posts || [];
    var totalImpressions = posts.reduce(function(s, p) { return s + (p.impressions || 0); }, 0);
    var totalEngagement  = posts.reduce(function(s, p) { return s + (p.reactions || 0) + (p.comments || 0) + (p.shares || 0); }, 0);
    var avgEng = posts.length
      ? (posts.reduce(function(s, p) {
          var eng = (p.reactions || 0) + (p.comments || 0) + (p.shares || 0);
          return s + (p.impressions ? eng / p.impressions * 100 : 0);
        }, 0) / posts.length).toFixed(1)
      : '—';

    var sorted  = posts.slice().sort(function(a, b) {
      return ((b.reactions||0)+(b.comments||0)+(b.shares||0)) - ((a.reactions||0)+(a.comments||0)+(a.shares||0));
    });
    var bestPost = sorted[0];
    var top3     = sorted.slice(0, 3);
    var maxEng   = sorted[0] ? (sorted[0].reactions||0)+(sorted[0].comments||0)+(sorted[0].shares||0) : 1;

    /* Topics */
    var topicCounts = {};
    posts.forEach(function(p) { var t = p.topic || 'Other'; topicCounts[t] = (topicCounts[t] || 0) + 1; });
    var topicEntries = Object.keys(topicCounts).map(function(k) { return [k, topicCounts[k]]; });
    topicEntries.sort(function(a, b) { return b[1] - a[1]; });

    var initials = founder.name.split(' ').map(function(w) { return w[0]; }).join('').slice(0, 2).toUpperCase();

    /* Post rows */
    var postRows = posts.length ? posts.map(function(p) {
      var eng    = (p.reactions||0) + (p.comments||0) + (p.shares||0);
      var barPct = Math.round(eng / maxEng * 100);
      return '<tr>' +
        '<td class="date-cell">' + (p.date||'') + '</td>' +
        '<td class="excerpt-cell"><span>' + (p.excerpt||'') + '</span></td>' +
        '<td><span class="format-badge format-' + (p.format||'Text') + '">' + (p.format||'—') + '</span></td>' +
        '<td style="font-size:0.82rem">' + (p.topic||'—') + '</td>' +
        '<td class="num-cell">' + (p.impressions||0).toLocaleString() + '</td>' +
        '<td class="num-cell">' + (p.reactions||'—') + '</td>' +
        '<td class="num-cell">' + (p.comments||'—') + '</td>' +
        '<td class="num-cell">' + (p.shares||'—') + '</td>' +
        '<td class="eng-cell"><div class="eng-bar">' + eng + '<div class="eng-track"><div class="eng-fill" style="width:' + barPct + '%"></div></div></div></td>' +
        '</tr>';
    }).join('') : '<tr><td colspan="9" style="color:var(--muted);text-align:center;padding:2rem;">No posts this period</td></tr>';

    /* Spotlight cards */
    var spotlightCards = top3.map(function(p, i) {
      var eng  = (p.reactions||0) + (p.comments||0) + (p.shares||0);
      var rate = p.impressions ? (eng / p.impressions * 100).toFixed(1) : '—';
      var lbl  = ['#1 Best', '#2', '#3'][i];
      return '<div class="spotlight-card">' +
        '<div class="spotlight-rank">' + lbl + '</div>' +
        '<div class="post-meta"><span>' + (p.date||'') + '</span><span class="format-badge format-' + (p.format||'Text') + '">' + (p.format||'') + '</span><span>' + (p.topic||'') + '</span></div>' +
        '<p class="excerpt">"' + (p.excerpt||'') + '"</p>' +
        '<div class="spotlight-stats">' +
          '<span><strong>' + (p.impressions||0).toLocaleString() + '</strong> impressions</span>' +
          '<span><strong>' + eng + '</strong> engagements</span>' +
          '<span><strong>' + rate + '%</strong> eng. rate</span>' +
        '</div></div>';
    }).join('');

    /* Topic bars */
    var topicBars = topicEntries.map(function(e) {
      var pct = Math.round(e[1] / posts.length * 100);
      return '<div class="topic-row">' +
        '<div class="topic-label"><span class="name">' + e[0] + '</span><span class="count">' + e[1] + ' post' + (e[1] > 1 ? 's' : '') + '</span></div>' +
        '<div class="topic-bar-track"><div class="topic-bar-fill" style="width:' + pct + '%"></div></div>' +
        '</div>';
    }).join('');

    /* Panel */
    var panel = document.createElement('div');
    panel.className = 'founder-panel' + (fi === 0 ? ' active' : '');
    panel.id = 'panel-' + fi;
    panel.innerHTML =
      '<div class="founder-identity">' +
        '<div class="founder-avatar">' + initials + '</div>' +
        '<div><h2>' + founder.name + '</h2><div class="title-tag">' + (founder.title||'') + '</div></div>' +
      '</div>' +
      '<div class="kpi-strip">' +
        '<div class="kpi-card"><div class="kpi-label">Posts Published</div><div class="kpi-value">' + posts.length + '</div></div>' +
        '<div class="kpi-card"><div class="kpi-label">Total Impressions</div><div class="kpi-value">' + (totalImpressions >= 1000 ? (totalImpressions/1000).toFixed(1)+'k' : totalImpressions) + '</div></div>' +
        '<div class="kpi-card"><div class="kpi-label">Total Engagement</div><div class="kpi-value">' + totalEngagement.toLocaleString() + '</div></div>' +
        '<div class="kpi-card"><div class="kpi-label">Avg Eng. Rate</div><div class="kpi-value">' + avgEng + '%</div></div>' +
        '<div class="kpi-card best"><div class="kpi-label">Best Post</div><div class="kpi-value">' + (bestPost ? '"' + bestPost.excerpt.slice(0,52) + '…"' : '—') + '</div></div>' +
      '</div>' +
      '<div class="section"><div class="section-heading"><h2>Post Performance</h2></div>' +
        '<div class="table-wrap"><table>' +
          '<thead><tr><th>Date</th><th>Post</th><th>Format</th><th>Topic</th><th style="text-align:right">Impressions</th><th style="text-align:right">Reactions</th><th style="text-align:right">Comments</th><th style="text-align:right">Shares</th><th style="text-align:right">Total Eng.</th></tr></thead>' +
          '<tbody>' + postRows + '</tbody>' +
        '</table></div>' +
      '</div>' +
      '<div class="section"><div class="section-heading"><h2>Top 3 Posts</h2></div><div class="spotlight-grid">' + spotlightCards + '</div></div>' +
      '<div class="section"><div class="section-heading"><h2>Topic Distribution</h2></div><div class="topic-grid">' + topicBars + '</div></div>';

    panels.appendChild(panel);
  });

  /* Tab switching */
  tabs.addEventListener('click', function(e) {
    var btn = e.target.closest('.tab-btn');
    if (!btn) return;
    document.querySelectorAll('.tab-btn').forEach(function(b) { b.classList.remove('active'); });
    document.querySelectorAll('.founder-panel').forEach(function(p) { p.classList.remove('active'); });
    btn.classList.add('active');
    document.getElementById('panel-' + btn.dataset.index).classList.add('active');
  });
</script>

</body>
</html>
